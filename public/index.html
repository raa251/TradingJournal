<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trading Journal</title>
<meta name="description" content="Trading journal: calendar, trades, setup screenshots" />
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Journal" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="authScreen" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="brand" style="justify-content:center;margin-bottom:18px">📈 Trading Journal</div>
    <div class="seg" id="authTabs" data-value="signin" style="margin-bottom:16px">
      <button type="button" class="active" data-v="signin">Sign in</button>
      <button type="button" data-v="signup">Create account</button>
    </div>
    <form id="authForm">
      <div class="field"><label>Email</label><input type="email" id="authEmail" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="authPassword" required autocomplete="current-password" minlength="6"></div>
      <div class="error-msg" id="authErr"></div>
      <div class="muted" id="authInfo" style="font-size:0.85rem;margin-bottom:10px"></div>
      <button type="submit" class="btn btn-block" id="authSubmit">Sign in</button>
      <button type="button" class="btn btn-outline btn-block" id="authForgot" style="margin-top:8px">Forgot password?</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">📈 Trading Journal</div>
    <nav class="tabs">
      <button class="tab active" data-view="calendar">Calendar</button>
      <button class="tab" data-view="stats">Stats</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
  </header>

  <main id="main"></main>

  <button id="btnAdd" class="fab" title="Add trade" aria-label="Add trade">+</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
