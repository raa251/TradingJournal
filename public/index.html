<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trading Journal</title>
<meta name="description" content="Trading-Journal: Kalender, Trades, Setup-Bilder" />
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Journal" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">📈 Trading Journal</div>
    <nav class="tabs">
      <button class="tab active" data-view="calendar">Kalender</button>
      <button class="tab" data-view="stats">Statistik</button>
      <button class="tab" data-view="settings">Einstellungen</button>
    </nav>
    <button id="btnInstall" class="btn btn-ghost" hidden>Installieren</button>
  </header>

  <main id="main"></main>

  <button id="btnAdd" class="fab" title="Neuen Trade erfassen" aria-label="Neuen Trade erfassen">+</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
